name: Move the board item of a closed issue by its Kind

on:
  issues:
    types: [closed]

jobs:
  move:
    name: Move the board item
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.ISSUE_AUTOMATION }}
      ISSUE: ${{ github.repository }}#${{ github.event.issue.number }}
    steps:
    - name: Get the mover and its mapping
      run: |
        mkdir -p issue-automation
        for file in board-close-status.sh close-status-mapping.yaml; do
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/giantswarm/github/contents/tools/issue-automation/${file}" \
            | jq -r '.content' \
            | base64 -d > "issue-automation/${file}"
        done
        chmod +x issue-automation/board-close-status.sh
    - name: Move the item
      run: issue-automation/board-close-status.sh "${ISSUE}"
    # The board's own "Item closed" workflow writes its one Status within
    # seconds of the close; a write of it that lands after the first pass is
    # undone by the second.
    - name: Move the item again, after the board's own workflow
      run: |
        sleep 60
        issue-automation/board-close-status.sh "${ISSUE}"
